    <style>
    
  
      :root {

	--keywords: "resplandor de tarjeta, portal, tarjeta interactiva, box-shadow, túnel 3D, Three.js, animación, animación CSS, animación JavaScript, efectos de partículas, efectos brillantes, codepenchallenge, cpc-card-glow, experiencia web inmersiva";

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}




body {
	overflow: hidden;
	background: url("https://bucket.mlcdn.com/a/3336/3336910/images/3a6d0dba754abc967603ee3cbbebf0dee201eb00.png") no-repeat center center fixed;

	align-items: center;

	position: relative;

color: #ff8a5c;
}

	    

#portalCard {
	position: absolute;
	width: 380px;
	height: 450px;
	background: rgba(10, 12, 18, 0.6);
	backdrop-filter: blur(10px);
	border-radius: 20px;
	border: 1px solid rgba(var(--primary-rgb), 0.8);
	box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.5),
		0 0 50px rgba(var(--primary-rgb), 0.3),
		inset 0 0 20px rgba(var(--primary-rgb), 0.2);
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	transition: all 0.5s cubic-bezier(0.1, 1, 0.1, 1);
	z-index: 10;
	overflow: hidden;
	transform-style: preserve-3d;
	transform: scale(0.85);
}

#portalCard::before {
	content: "";
	position: absolute;
	inset: 0;
	border-radius: 19px;
	padding: 1px;
	background: linear-gradient(135deg, var(--primary-color), var(--primary-color));
	-webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
	-webkit-mask-composite: xor;
	mask-composite: exclude;
	opacity: 0.9;
	transition: opacity 0.5s ease;
	z-index: 2;
	box-shadow: 0 0 20px var(--primary-color);
}

#portalCard::after {
	content: "";
	position: absolute;
	inset: 0;
	border-radius: 20px;
	background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.15) 0%, rgba(var(--primary-rgb), 0.15) 100%);
	opacity: 0.5;
	z-index: 1;
}

.gooey-effect {
	position: absolute;
	inset: 0;
	border-radius: 20px;
	overflow: hidden;
	z-index: 0;
	opacity: 0.9;
	filter: blur(2px);
}

.gooey-blob {
	position: absolute;
	border-radius: 50%;
	filter: blur(12px);
	animation: float-blob 5s infinite ease-in-out;
	opacity: 0.9;
}

.gooey-blob:nth-child(1),
.gooey-blob:nth-child(2),
.gooey-blob:nth-child(3),
.gooey-blob:nth-child(4) {
	background: radial-gradient(circle, rgba(var(--primary-rgb), 0.7) 0%, rgba(var(--primary-rgb), 0) 70%);
}

.gooey-blob:nth-child(1) {
	width: 250px;
	height: 250px;
	left: -50px;
	top: 100px;
	animation-duration: 2.67s;
}

.gooey-blob:nth-child(2) {
	width: 200px;
	height: 200px;
	right: -30px;
	top: 50px;
	animation-duration: 2.67s;
	animation-delay: -1s;
}

.gooey-blob:nth-child(3) {
	width: 180px;
	height: 180px;
	right: 50px;
	bottom: 100px;
	animation-duration: 3.33s;
	animation-delay: -1.33s;
}

.gooey-blob:nth-child(4) {
	width: 220px;
	height: 220px;
	left: 30px;
	bottom: 30px;
	animation-duration: 3.33s;
	animation-delay: -1.33s;
}

@keyframes float-blob {
	0%, 100% { transform: translate(0, 0) scale(1); }
	20% { transform: translate(30px, 20px) scale(1.05); }
	40% { transform: translate(20px, 40px) scale(0.95); }
	60% { transform: translate(-20px, 30px) scale(1.1); }
	80% { transform: translate(-30px, -20px) scale(0.9); }
}

#portalCard h1 {
	color: white;

#portalContent {

<script>
  // Crear y mostrar el cargador
  function showLoader() {
    const loader = document.createElement('div');
    loader.className = 'page-loader';
    loader.innerHTML = `
      <div class="loader-header">Espera un momento...</div>
      <div class="progress"></div>
    `;
    document.body.appendChild(loader);
    return loader;
  }

  // Ocultar el cargador después de 2 segundos
  function initLoader() {
    const loader = showLoader();
    
    setTimeout(() => {
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 300); // Eliminar después del desvanecimiento
    }, 2000); // Duración de 2 segundos
  }

  // Inicializar cuando el DOM esté listo
  document.addEventListener('DOMContentLoaded', initLoader);
</script>

<body>
    <div id="portalCard">
    <div class="gooey-effect">
		<div class="gooey-blob"></div>
		<div class="gooey-blob"></div>
		<div class="gooey-blob"></div>
		<div class="gooey-blob"></div>
	</div>
        <h3>BIENVENIDO A</h3><br>
        <h1>PROJECT</h1>
        <h1>FREEDOM</h1><br>

<br><br>
<p style="font-size: 10px; color: white;">Desarrollado con 💖 por Bebell Digital Solutions</p>

<canvas id="tunnelCanvas" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999;"></canvas>









    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    
    <script>
        
 // Efecto de sonido único
const cinematicWhip = new Audio('https://cdn.shopify.com/s/files/1/0242/0175/6777/files/mixkit-futuristic-cinematic-noise-whip-1518.wav?v=1748880406');
cinematicWhip.preload = 'auto';
cinematicWhip.load();

// Variables de control de animación
let animationId = null;
let renderer, scene, camera, tube, stars;

// Función auxiliar para audio
function fadeAudio(audioElement, targetVolume, duration) {
    const initialVolume = audioElement.volume;
    const delta = targetVolume - initialVolume;
    const startTime = Date.now();
    
    function updateVolume() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        audioElement.volume = initialVolume + delta * progress;
        
        if (progress < 1) {
            requestAnimationFrame(updateVolume);
        }
    }
    
    updateVolume();
}

// Elementos del portal
const card = document.getElementById("portalCard");
const button = document.getElementById("portalButton");
const canvasTunnel = document.getElementById("tunnelCanvas");

// URL de destino
const DESTINATION_URL = "/home";

// Listeners de eventos
card.addEventListener("click", startPortal);
button.addEventListener("click", (e) => {
    e.stopPropagation();
    startPortal();
});

// Función principal del portal
function startPortal() {
    // Reproducir el sonido cinematográfico inmediatamente al hacer clic
    cinematicWhip.currentTime = 0;
    cinematicWhip.volume = 1.0;
    cinematicWhip.play();
    
    // Animación de desaparición de la tarjeta
    card.classList.add("fadeOut");
    setTimeout(() => {
        card.remove();
    }, 500);
    
    // Configuración visual - mantener el fondo original visible
    canvasTunnel.style.display = "block";
    
    // Inicializar el túnel Three.js (con fondo transparente)
    initTunnel();
    
    // Crear elementos de superposición oscura y logo
    const darkOverlay = document.createElement("div");
    darkOverlay.className = "dark-overlay";
    document.body.appendChild(darkOverlay);
    
    const logoOverlay = document.createElement("div");
    logoOverlay.className = "logo-overlay";
    document.body.appendChild(logoOverlay);
    
    // Línea de tiempo de animación:
    // 0s - Se produce el clic, comienza el sonido, la tarjeta comienza a desvanecerse
    // 0.5s - La tarjeta se elimina por completo
    // 1.0s - La superposición oscura comienza a aparecer (muy sutil al principio)
    // 1.5s - El logo aparece con efecto de zoom-in
    // 2.5s - La superposición oscura alcanza su opacidad máxima
    // 3.0s - Ocultar el túnel por completo
    // 3.5s - El sonido comienza a desvanecerse
    // 4.0s - El logo comienza a desvanecerse
    // 4.5s - Redirigir
    
    // Iniciar desvanecimiento de la superposición oscura a los 1.0s
    setTimeout(() => {
        darkOverlay.style.opacity = "0.1";
        
        // Aumentar gradualmente la superposición oscura
        const darkFadeInterval = setInterval(() => {
            const currentOpacity = parseFloat(darkOverlay.style.opacity || "0");
            if (currentOpacity < 1) {
                darkOverlay.style.opacity = (currentOpacity + 0.05).toString();
            } else {
                clearInterval(darkFadeInterval);
            }
        }, 50);
        
        // Mostrar logo con efecto zoom-in a los 1.5s
        setTimeout(() => {
            logoOverlay.classList.add("visible");
        }, 500);
        
        // Ocultar completamente el túnel a los 3.0s (manteniendo el fondo)
        setTimeout(() => {
            cleanupTunnel();
            // Asegurar que la superposición oscura cubra todo
            darkOverlay.style.backgroundColor = "hsl(var(--hue-color), 19%, 5%)";
        }, 2000);
        
        // Comenzar a desvanecer el sonido a los 3.5s
        setTimeout(() => {
            fadeAudio(cinematicWhip, 0, 500);
        }, 2500);
        
        // Comenzar a desvanecer el logo a los 4.0s
        setTimeout(() => {
            logoOverlay.classList.add("fade-out");
        }, 3000);
        
        // Redirigir a los 4.5s
        setTimeout(() => {
            window.location.href = DESTINATION_URL;
        }, 3500);
    }, 1000);
}

// Animación del Túnel Three.js (con fondo transparente)
function initTunnel() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    
    // Renderizador con fondo transparente
    renderer = new THREE.WebGLRenderer({
        canvas: canvasTunnel,
        antialias: true,
        alpha: true
    });
    renderer.setSize(w, h);
    renderer.setClearColor(0x000000, 0); // Fondo transparente
    
    // Escena
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.005);
    
    // Cámara
    camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 1000);
    
    // Crear camino circular
    const path = createCircularPath();
    
    // Geometría del tubo
    const tubeGeometry = new THREE.TubeGeometry(
        path,
        200,
        3,
        12,
        false
    );
    
    // Material del tubo
    const material = new THREE.MeshBasicMaterial({
        side: THREE.BackSide,
        wireframe: true,
        color: 0xff5011, // Actualizado para coincidir con el nuevo color primario
        transparent: true,
        opacity: 0.8
    });
    
    // Malla del tubo
    tube = new THREE.Mesh(tubeGeometry, material);
    scene.add(tube);
    
    // Estrellas
    const starsGeometry = new THREE.BufferGeometry();
    const starsMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 1,
        transparent: true
    });
    
    const starsPositions = new Float32Array(2000 * 3);
    for (let i = 0; i < 2000; i++) {
        starsPositions[i * 3] = (Math.random() - 0.5) * 2000;
        starsPositions[i * 3 + 1] = (Math.random() - 0.5) * 2000;
        starsPositions[i * 3 + 2] = (Math.random() - 0.5) * 2000;
    }
    
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
    stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);
    
    // Variables de animación
    let pct = 0;
    const duration = 2.5; // Duración más corta del túnel para coincidir con la nueva línea de tiempo
    const startTime = Date.now();
    
    // Bucle de animación
    function animate() {
        const elapsed = (Date.now() - startTime) / 1000;
        pct = Math.min(elapsed / duration, 1);
        
        // Mover la cámara a lo largo del camino
        const lookAheadPct = Math.min(pct + 0.01, 1);
        const pt1 = path.getPointAt(pct);
        const pt2 = path.getPointAt(lookAheadPct);
        
        camera.position.set(pt1.x, pt1.y, pt1.z);
        camera.lookAt(pt2);
        
        // Renderizar
        renderer.render(scene, camera);
        
        // Continuar la animación hasta completar
        if (pct < 1) {
            animationId = requestAnimationFrame(animate);
        }
    }
    
    // Iniciar animación
    animate();
    
    // Manejar redimensionamiento de la ventana
    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });
}

// Limpiar recursos de Three.js
function cleanupTunnel() {
    if (animationId) {
        cancelAnimationFrame(animationId);
    }
    if (renderer) {
        renderer.dispose();
    }
    if (scene) {
        while(scene.children.length > 0){ 
            scene.remove(scene.children[0]); 
        }
    }
    if (canvasTunnel) {
        canvasTunnel.style.display = "none";
    }
}

// Crear camino circular para el túnel
function createCircularPath() {
    const points = [];
    const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(20, 10, -50),
        new THREE.Vector3(40, -10, -100),
        new THREE.Vector3(60, 15, -150),
        new THREE.Vector3(50, -5, -200),
        new THREE.Vector3(0, 0, -250),
        new THREE.Vector3(-100, 0, -200),
        new THREE.Vector3(-150, 0, -100),
        new THREE.Vector3(-100, 0, 0),
        new THREE.Vector3(-50, 10, 100),
        new THREE.Vector3(-20, -10, 150),
        new THREE.Vector3(0, 0, 200)
    ]);
    
    curve.tension = 0.1;
    
    for (let i = 0; i < 200; i++) {
        const t = i / 199;
        points.push(curve.getPointAt(t));
    }
    
    return curve;
}
